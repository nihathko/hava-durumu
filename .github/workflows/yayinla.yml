# Siteyi GitHub Pages'e yayınlar. Her gönderimde ve yarım saatte bir çalışır:
# havalimanı ölçümlerini (METAR/TAF, NOAA) indirip data/metar.json olarak sitenin yanına koyar.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Havalimanı ölçümlerini indir
        run: |
          mkdir -p data
          curl -sf --max-time 60 "https://aviationweather.gov/api/data/metar?bbox=35.8,25.6,42.2,45&format=json" -o data/metar-ham.json || echo '[]' > data/metar-ham.json
          curl -sf --max-time 60 "https://aviationweather.gov/api/data/taf?bbox=35.8,25.6,42.2,45&format=json" -o data/taf-ham.json || echo '[]' > data/taf-ham.json
          curl -sf --max-time 60 "https://aviationweather.gov/api/data/isigmet?format=json" -o data/sigmet-ham.json || echo '[]' > data/sigmet-ham.json
          curl -sf --max-time 60 "https://aviationweather.gov/api/data/metar?ids=EGLL,LFPG,EDDB,EHAM,LOWW,LIRF,LEMD,LGAV,LBSF,LROP,LQSA,LWSK,BKPR,LCEN,UUEE,UBBB,UGTB,UTTT,UACC,UCFM,UTAA,OIII,ORBI,LLBG,HECA,OEJN,OEMA,OERK,OMDB,OTHH,KJFK,KLAX,CYYZ,RJTT,ZBAA,RKSI,YSSY&format=json" -o data/dunya-ham.json || echo '[]' > data/dunya-ham.json
          node .github/metar.js
          rm -f data/metar-ham.json data/taf-ham.json data/sigmet-ham.json data/dunya-ham.json

      - name: Tarih
        id: tarih
        run: |
          echo "gun=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "uc=$(date -u +%Y-%m-%d)-$(( $(date -u +%-H) / 3 ))" >> "$GITHUB_OUTPUT"

      # Tahmin haritaları: Türkiye ızgarası ve 81 il, 7 gün. 3 saatte bir yeniden hesaplanır, arada önbellekten gelir
      - name: Tahmin haritası önbelleği
        id: tahmin
        uses: actions/cache@v4
        with:
          path: data/tahmin.json
          key: tahmin-${{ steps.tarih.outputs.uc }}
          restore-keys: tahmin-

      - name: Tahmin haritası verisini hazırla (Open-Meteo)
        if: steps.tahmin.outputs.cache-hit != 'true'
        run: node .github/tahmin.js kisa || echo "tahmin alınamadı, önceki dosya kullanılır"

      # Haftalık ve aylık eğilim (ECMWF SEAS5) günde bir kez
      - name: Uzun vadeli tahmin önbelleği
        id: uzun
        uses: actions/cache@v4
        with:
          path: data/uzun-vade.json
          key: uzun-vade-${{ steps.tarih.outputs.gun }}
          restore-keys: uzun-vade-

      - name: Uzun vadeli tahmin verisini hazırla (ECMWF SEAS5)
        if: steps.uzun.outputs.cache-hit != 'true'
        run: node .github/tahmin.js uzun || echo "uzun vade alınamadı"

      # 81 ilin aylık analiz verisi günde bir kez hesaplanır; aynı gün içindeki yayınlarda önbellekten gelir
      - name: Analiz verisi önbelleği
        id: analiz
        uses: actions/cache@v4
        with:
          path: data/analiz.json
          key: analiz-${{ steps.tarih.outputs.gun }}

      - name: Analiz verisini hesapla (NASA POWER)
        if: steps.analiz.outputs.cache-hit != 'true'
        run: node .github/analiz.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: yayin
        uses: actions/deploy-pages@v4
